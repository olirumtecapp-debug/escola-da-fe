gamos os ruídos ensurdecedores do mundo, encontramos a nós mesmos e descobrimos a presença viva de Cristo que habita em nós pela graça.", "comoViver": ["Faça pelo menos 15 minutos de silêncio meditativo após a Missa ou ao entardecer.", "Desligue a televisão da sala e aproveite para conversar serenamente com quem mora com você.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Fazei calar em mim, Senhor, as vozes do mundo para que eu ouça a Vossa doce melodia de amor.", "gestoPratico": "Faça pelo menos 15 minutos de silêncio meditativo após a Missa ou ao entardecer.", "cic": "CIC § 2709"}, {"week": 43, "title": "Domingo — A Gratidão pelas Bênçãos Semanais", "subtitle": "O Hino da alma agradecida que não esquece os favores de Deus", "misterio": "'Bendize, ó minha alma, ao Senhor, e não te esqueças de nenhum de seus benefícios' (Sl 102). O domingo é o dia da Eucaristia — palavra que significa exatamente 'Ação de Graças'.", "comoViver": ["Escreva ou liste mentalmente 5 graças recebidas nos últimos sete dias e agradeça na Missa.", "Agradeça a quem preparou o almoço dominical com palavras de carinho sincero.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Por tudo o que nos destes e por tudo o que ainda haveis de conceder, obrigado, Senhor!", "gestoPratico": "Escreva ou liste mentalmente 5 graças recebidas nos últimos sete dias e agradeça na Missa.", "cic": "CIC § 2637"}, {"week": 44, "title": "Domingo — A Eucaristia como Pão dos Peregrinos", "subtitle": "O Alimento divino para a caminhada no deserto da vida", "misterio": "Sem a Eucaristia nós desfalecemos pelo caminho. Quando comungamos dignamente, o próprio Sangue de Cristo corre em nossas veias, dando-nos forças sobre-humanas para vencer o mal.", "comoViver": ["Guarde o jejum eucarístico de pelo menos 1 hora antes de receber a Sagrada Comunhão.", "Permaneça de joelhos por alguns minutos após a Comunhão em silenciosa e profunda adoração.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Senhor Jesus, Pão vivo descido do Céu, alimentai a minha alma e sustentai-me até a eternidade.", "gestoPratico": "Guarde o jejum eucarístico de pelo menos 1 hora antes de receber a Sagrada Comunhão.", "cic": "CIC § 1384"}, {"week": 45, "title": "Domingo — A Saudade da Pátria Celeste", "subtitle": "Caminhantes na terra com o coração fincado no Céu", "misterio": "A liturgia dominical é a antecipação do banquete celeste da Nova Jerusalém. Fomos criados para o Céu; a terra é apenas o caminho de passagem onde aprendemos a amar.", "comoViver": ["Converse com seus familiares sobre a beleza e a realidade consoladora da vida eterna.", "Reze pelos entes queridos que já partiram desta vida, pedindo a Deus que os acolha na glória.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Nossa pátria está nos Céus, de onde esperamos ansiosos o Salvador, Nosso Senhor Jesus Cristo.", "gestoPratico": "Converse com seus familiares sobre a beleza e a realidade consoladora da vida eterna.", "cic": "CIC § 1042"}, {"week": 46, "title": "Domingo — A Comunhão dos Santos e o Abraço da Igreja", "subtitle": "Cercados por uma nuvem incontável de testemunhas", "misterio": "Ao celebrarmos o domingo, não estamos sós: a multidão dos anjos, mártires, virgens e santos do Céu junta suas vozes às nossas para cantar o Santo, Santo, Santo ao Cordeiro de Deus.", "comoViver": ["Invoque o seu anjo da guarda e os santos padroeiros da sua família neste domingo.", "Conheça e conte aos filhos a história do santo celebrado hoje na liturgia.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Em comunhão com todos os Santos e Anjos do Céu, louvamos e bendizemos o Vosso Santo Nome!", "gestoPratico": "Invoque o seu anjo da guarda e os santos padroeiros da sua família neste domingo.", "cic": "CIC § 956"}, {"week": 47, "title": "Domingo — A Oração Litúrgica em Família", "subtitle": "A Igreja viva que floresce dentro de cada lar", "misterio": "Quando dois ou três estão reunidos em meu nome, Eu estou no meio deles. Uma família que reza unida no domingo permanece unida contra todas as tempestades da vida.", "comoViver": ["Reúna a família ao entardecer para rezar uma Salve Rainha e aspergir a casa com água benta.", "Coloque uma imagem sagrada na mesa ou sala de estar com uma vela acesa durante a oração.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Jesus, Maria e José, a nossa família vossa é. Protegei o nosso lar contra todo o mal.", "gestoPratico": "Reúna a família ao entardecer para rezar uma Salve Rainha e aspergir a casa com água benta.", "cic": "CIC § 2685"}, {"week": 48, "title": "Domingo — A Luz do Domingo para Iluminar a Nova Semana", "subtitle": "Levar a presença de Cristo para o mundo de segunda-feira", "misterio": "A Missa não termina na porta da igreja: 'Ide em paz e o Senhor vos acompanhe'. O domingo nos recarrega para que de segunda a sábado sejamos sal da terra e luz do mundo em nossos ambientes.", "comoViver": ["Planeje a sua semana que se inicia colocando em primeiro lugar os momentos de oração diária.", "Leve um propósito de paciência e honestidade para o seu ambiente de trabalho amanhã.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Ide em paz, e que a luz deste Domingo resplandeça em cada hora da nossa nova semana!", "gestoPratico": "Planeje a sua semana que se inicia colocando em primeiro lugar os momentos de oração diária.", "cic": "CIC § 1397"}, {"week": 49, "title": "Domingo — A Parábola das Dez Virgens: A Vigilância e o Óleo da Fé", "subtitle": "Estar acordado para acolher o Esposo que vem", "misterio": "Cinco virgens eram prudentes e levaram azeite para as lâmpadas; cinco eram imprevidentes. O domingo nos recorda: 'Vigiai, porque não sabeis o dia nem a hora'. A fé precisa do azeite vivo da caridade cotidiana.", "comoViver": ["Examine se sua lâmpada da oração está acesa ou se você tem vivido distraído com o mundo.", "Faça um ato concreto de caridade hoje que encha a sua lâmpada de bom azeite espiritual.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Senhor, mantende a minha lâmpada acesa na fé para que eu Vos receba com alegria ao Vosso retorno.", "gestoPratico": "Examine se sua lâmpada da oração está acesa ou se você tem vivido distraído com o mundo.", "cic": "CIC § 2612"}, {"week": 50, "title": "Domingo — A Parábola dos Talentos: A Fidelidade no Pouco", "subtitle": "Multiplicar os dons recebidos de Deus com generosidade", "misterio": "O Senhor confiou talentos aos seus servos: a quem produziu muito, Ele disse: 'Muito bem, servo bom e fiel, entra no gozo do teu Senhor!'. A vida presente é o tempo oportuno de fazer o bem.", "comoViver": ["Identifique um talento que Deus te deu (ensinar, acolher, cozinhar, liderar) e coloque-o a serviço da Igreja.", "Ensine seus filhos a não enterrarem os dons de Deus por preguiça ou medo.", "Guarde o descanso sagrado do Dia do Senhor, abster-se de trabalho servil e cultive a oração em família."], "oracao": "Senhor, que eu não esconda os Vossos dons, mas os multiplique em boas obras para a Vossa glória.", "gestoPratico": "Identifique um talento que Deus te deu (ensinar, acolher, cozinhar, liderar) e coloque-o a serviço da Igreja.", "cic": "CIC § 1880"}, {"week": 51, "title": "Domingo — Cristo, Rei do Universo: O Senhor dos Senhores", "subtitle": "A Soberania de Jesus sobre a história e os corações", "misterio": "Cristo é o Alfa e o Ômega, o Princípio e o Fim de todas as coisas. Seu Reino não é deste mundo, mas é Reino de verdade e de vida, de santidade e         // Algoritmo para calcular o número da semana no ano (1 a 52)
        const getWeekNumber = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
            return Math.max(1, Math.min(52, weekNo));
        };

        // 1. Cálculo Canônico da Páscoa (Algoritmo de Meeus/Gauss para o calendário Gregoriano)
        const getEasterDate = (year) => {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31) - 1; // 0 = Jan, 2 = Mar, 3 = Abr
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month, day);
        };

        const getLiturgicalCycle = (year) => {

            if (rem === 2) {
                return { code: 'A', label: 'Ano A', evangelist: 'São Mateus', desc: 'Evangelho de São Mateus proclamado aos domingos' };
            } else if (rem === 0) {
                return { code: 'B', label: 'Ano B', evangelist: 'São Marcos', desc: 'Evangelho de São Marcos proclamado aos domingos' };
            } else {

            // 4º domingo antes do Natal (Advento)
            const dec25 = new Date(year, 11, 25);
            const dec25DayOfWeek = dec25.getDay();
            const daysToSunday = dec25DayOfWeek === 0 ? 7 : dec25DayOfWeek;
            const fourthAdventSunday = new Date(year, 11, 25 - daysToSunday);

        );

        // --- APLICAÇÃO PRINCIPAL (APP) ---
        const App = () => {
            const [selectedYear, setSelectedYear] = React.useState(2026);
            const [selectedDateEvents, setSelectedDateEvents] = React.useState(null);

            const handleNavigate = (e) => {
                e.preventDefault();
                const targetId = e.currentTarget.getAttribute('href').substring(1);
                const element = document.getElementById(targetId);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Header onNavigate={handleNavigate} />
                    <main className="flex-grow">
                        <Hero 
                            selectedYear={selectedYear} 
                            onYearChange={setSelectedYear} 
                            onOpenModal={setSelectedDateEvents}
                        />
                        <TodaySpiritualCard onOpenModal={setSelectedDateEvents} />
                        <Calendar 
                            year={selectedYear} 
                            onOpenModal={setSelectedDateEvents}
                        />
                        <TenCommandmentsSection />
                        <FivePreceptsSection />
                        <PracticalGuides />
                    </main>
                    <Footer />

                    {selectedDateEvents && (
                        <EventModal 
                            eventData={selectedDateEvents.events} 
                            date={selectedDateEvents.date} 
                            onClose={() => setSelectedDateEvents(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
